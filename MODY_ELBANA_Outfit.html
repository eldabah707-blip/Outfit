<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MODY ELBANA | Outfit</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      min-height:100vh;font-family:Arial,Tahoma,sans-serif;
      background:radial-gradient(circle at top right,#382060 0%,transparent 35%),
                 radial-gradient(circle at bottom left,#102f50 0%,transparent 35%),#07070b;
      color:#fff;display:flex;justify-content:center;align-items:center;
      padding:20px;overflow-x:hidden
    }
    body:before{content:"";position:fixed;width:300px;height:300px;background:#8b5cf6;
      filter:blur(150px);opacity:.12;top:-100px;left:-100px;pointer-events:none}
    .container{width:100%;max-width:520px;position:relative;z-index:1}
    .card{background:rgba(18,18,25,.72);border:1px solid rgba(255,255,255,.08);
      backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:28px;
      padding:30px;box-shadow:0 25px 80px rgba(0,0,0,.45)}
    .brand{text-align:center;margin-bottom:28px}
    .logo{width:70px;height:70px;margin:auto;border-radius:22px;display:flex;
      justify-content:center;align-items:center;font-size:25px;font-weight:900;
      background:linear-gradient(135deg,#8b5cf6,#06b6d4);box-shadow:0 10px 35px rgba(139,92,246,.3)}
    .brand h1{margin-top:18px;font-size:27px;letter-spacing:1px}
    .brand p{margin-top:8px;color:#999;font-size:14px}
    .input-title{display:block;color:#bbb;font-size:14px;margin-bottom:9px}
    input{width:100%;height:55px;border:1px solid #292933;background:#101017;color:white;
      border-radius:15px;padding:0 17px;outline:none;font-size:16px;direction:ltr;transition:.25s}
    input:focus{border-color:#8b5cf6;box-shadow:0 0 0 4px rgba(139,92,246,.1)}
    button,.download{width:100%;height:55px;margin-top:14px;border:0;border-radius:15px;color:white;
      font-size:16px;font-weight:bold;cursor:pointer;background:linear-gradient(135deg,#8b5cf6,#06b6d4);
      transition:.25s;box-shadow:0 10px 30px rgba(99,102,241,.2)}
    button:hover,.download:hover{transform:translateY(-2px);box-shadow:0 15px 35px rgba(99,102,241,.3)}
    button:active{transform:scale(.98)}
    button:disabled{opacity:.6;cursor:not-allowed;transform:none}
    .loading{display:none;text-align:center;margin-top:22px;color:#aaa}
    .spinner{width:28px;height:28px;margin:0 auto 10px;border:3px solid #333;border-top-color:#8b5cf6;
      border-radius:50%;animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .error{display:none;margin-top:18px;padding:13px;border-radius:12px;text-align:center;color:#ff8d8d;
      background:rgba(255,50,50,.08);border:1px solid rgba(255,50,50,.12);font-size:14px}
    .result{display:none;margin-top:25px;animation:show .5s ease}
    @keyframes show{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}
    .image-wrapper{background:#0c0c11;padding:8px;border-radius:20px;border:1px solid rgba(255,255,255,.08);overflow:hidden}
    .image-wrapper img{display:block;width:100%;max-height:600px;object-fit:contain;border-radius:15px}
    .download{display:block;text-align:center;text-decoration:none;line-height:55px}
    .info{display:flex;justify-content:space-between;align-items:center;margin:15px 3px 0;color:#888;font-size:12px}
    .status{color:#5ee6a8}
    footer{text-align:center;margin-top:25px;color:#666;font-size:12px}
    footer strong{color:#aaa}
    @media(max-width:480px){.card{padding:22px;border-radius:23px}.brand h1{font-size:23px}}
  </style>
</head>
<body>
  <main class="container">
    <section class="card">
      <div class="brand">
        <div class="logo">ME</div>
        <h1>MODY ELBANA</h1>
        <p>Outfit Image Generator</p>
      </div>

      <label class="input-title">UID</label>
      <input id="uid" type="text" inputmode="numeric" autocomplete="off"
             placeholder="اكتب UID هنا...">

      <button id="getBtn" onclick="getImage()">✨ جلب الصورة</button>

      <div class="loading" id="loading">
        <div class="spinner"></div>
        جاري جلب الصورة...
      </div>

      <div class="error" id="error"></div>

      <div class="result" id="result">
        <div class="image-wrapper">
          <img id="outfitImage" alt="Outfit Image">
        </div>
        <div class="info">
          <span>Outfit Image</span>
          <span class="status">● تم التحميل</span>
        </div>
        <a id="downloadBtn" class="download" href="#" target="_blank" rel="noopener">
          ⬇️ فتح / تحميل الصورة
        </a>
      </div>

      <footer>Made with ❤️ by <strong>MODY ELBANA</strong></footer>
    </section>
  </main>

  <script>
    const API = "https://sheihk-anamul-outfit-api2.vercel.app/api/sheihk-outfit";

    async function getImage() {
      const uid = document.getElementById("uid").value.trim();
      const button = document.getElementById("getBtn");
      const loading = document.getElementById("loading");
      const error = document.getElementById("error");
      const result = document.getElementById("result");
      const image = document.getElementById("outfitImage");
      const download = document.getElementById("downloadBtn");

      error.style.display = "none";
      result.style.display = "none";

      if (!uid) {
        error.textContent = "⚠️ من فضلك اكتب UID";
        error.style.display = "block";
        return;
      }

      button.disabled = true;
      loading.style.display = "block";

      try {
        const response = await fetch(`${API}?uid=${encodeURIComponent(uid)}`);
        if (!response.ok) throw new Error("API Error");

        const data = await response.json();

        if (data.status === true && data.image_link) {
          image.src = data.image_link;
          download.href = data.image_link;
          result.style.display = "block";
        } else {
          throw new Error("No image");
        }
      } catch (err) {
        console.error(err);
        error.textContent = "❌ حصل خطأ أثناء جلب الصورة. تأكد من الـ UID وحاول مرة أخرى.";
        error.style.display = "block";
      } finally {
        loading.style.display = "none";
        button.disabled = false;
      }
    }

    document.getElementById("uid").addEventListener("keydown", function(event) {
      if (event.key === "Enter") getImage();
    });
  </script>
</body>
</html>
